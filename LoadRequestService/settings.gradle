pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'LoadRequestService'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':r2dbc-mysql'
project(':r2dbc-mysql').projectDir = file('./infrastructure/driven-adapters/r2dbc-mysql')
include ':reactive-web'
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
include ':helpers'
project(':helpers').projectDir = file('./infrastructure/helpers')
include ':metrics'
project(':metrics').projectDir = file('./infrastructure/helpers/metrics')
include ':sqs-sender'
project(':sqs-sender').projectDir = file('./infrastructure/driven-adapters/sqs-sender')
include ':sqs-listener'
project(':sqs-listener').projectDir = file('./infrastructure/driven-adapters/sqs-listener')
include ':aws-sqs'
project(':aws-sqs').projectDir = file('./infrastructure/driven-adapters/aws-sqs')
include ':auth-client'
project(':auth-client').projectDir = file('./infrastructure/driven-adapters/auth-client')