server:
  port: 8081
spring:
  application:
    name: "LoadRequestService"
  devtools:
    add-properties: false
  profiles:
    include: null

  # ✅ CONFIGURACIÓN R2DBC para LoadRequestService - Base de datos loans_db (LOCAL)
  r2dbc:
    url: r2dbc:mysql://localhost:3306/loans_db
    username: root
    password: "1234"
    pool:
      # ✅ POOLING automático de Spring Boot
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
adapters:
  r2dbc:
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:loans_db}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}