# Configuración específica para entorno Docker
# LoadRequestService - Microservicio de Solicitudes

spring:
  application:
    name: "LoadRequestService"
  
  # Configuración R2DBC para contenedor - LoadRequestService apunta a loans_db
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:mysql://mysql-loans:3306/loans_db}
    username: ${SPRING_R2DBC_USERNAME:loans_user}
    password: ${SPRING_R2DBC_PASSWORD:loans_pass}
    pool:
      enabled: ${SPRING_R2DBC_POOL_ENABLED:true}
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:20}
      max-idle-time: ${SPRING_R2DBC_POOL_MAX_IDLE_TIME:30m}
      validation-query: SELECT 1

# Configuración del servidor
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

# Configuración de servicios externos
external-services:
  auth-service:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8080}
    validate-token-endpoint: ${AUTH_SERVICE_VALIDATE_TOKEN_ENDPOINT:/api/v1/auth/validate-token}
    timeout: 5000ms

# Configuración CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8081}

# Configuración AWS para notificaciones
aws:
  region: ${AWS_REGION:us-east-2}
  sqs:
    loan-decisions-queue-url: ${AWS_SQS_LOAN_DECISIONS_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/882309621524/sqs_notificaciones}

# Configuración de Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Configuración de Logging
logging:
  level:
    co.com.pragma: ${LOGGING_LEVEL_CO_COM_PRAGMA:INFO}
    org.springframework.r2dbc: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC:WARN}
    io.r2dbc.mysql: WARN
    reactor.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n"
  file:
    name: /app/logs/load-request-service.log
