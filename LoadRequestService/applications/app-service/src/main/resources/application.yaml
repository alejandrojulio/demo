server:
  port: 8081
spring:
  application:
    name: "LoadRequestService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
app:
  auth-service:
    base-url: "http://localhost:8080"
    timeout-seconds: 5
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:CrediYaInternalService2025SecureToken}
logging:
  level:
    co.com.pragma.security: "DEBUG"
    co.com.pragma.api: "DEBUG"
    org.springframework.security: "DEBUG"
    org.springframework.web.reactive.function.client: "DEBUG"
aws:
  region: ${AWS_REGION:us-east-2}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  sqs:
    # Cola para notificaciones de email
    loan-decisions-queue-url: ${AWS_SQS_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/882309621524/sqs_notificaciones}
    # Cola para ENVIAR requests al Lambda
    debt-capacity-queue-url: ${AWS_SQS_DEBT_CAPACITY_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/882309621524/sqs_capacidad}
    # Cola SEPARADA para RECIBIR responses del Lambda (fallback a cola principal si no existe)
    debt-capacity-response-queue-url: ${AWS_SQS_DEBT_CAPACITY_RESPONSE_QUEUE_URL:https://sqs.us-east-2.amazonaws.com/882309621524/sqs_capacidad_response}
    # Timeouts más generosos para conexiones lentas
    connection-timeout-ms: 30000
    read-timeout-ms: 60000
    
# Configuración local removida - usando AWS directo
