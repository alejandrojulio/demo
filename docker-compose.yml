# Docker Compose para CrediYa - Sistema Completo de Gestión de Préstamos
# Incluye microservicios de Autenticación y Solicitudes con sus bases de datos

version: '3.8'

# ========================================
# SERVICIOS
# ========================================
services:

  # ========================================
  # BASE DE DATOS SEPARADAS
  # ========================================
  
  # Base de datos para AuthService
  mysql-auth:
    image: mysql:8.0
    container_name: crediya-mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3308:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
      - ./database/auth-schema-init.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    networks:
      - crediya-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M

  # Base de datos para LoadRequestService  
  mysql-loans:
    image: mysql:8.0
    container_name: crediya-mysql-loans
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: loans_db
      MYSQL_USER: loans_user
      MYSQL_PASSWORD: loans_pass
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_loans_data:/var/lib/mysql
      - ./database/loans-schema-init.sql:/docker-entrypoint-initdb.d/01-loans-schema.sql:ro
    networks:
      - crediya-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M

  # ========================================
  # MICROSERVICIO - Autenticación
  # ========================================
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: crediya-auth-service
    restart: unless-stopped
    environment:
      # Configuración del Servidor
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      
      # Configuración JWT
      JWT_SECRET: CrediYa2025SecretKeyForJWTTokensVerySecureAndLong123456789
      JWT_EXPIRATION: 3600000
      
      # Token para comunicación entre servicios
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-CrediYaInternalService2025SecureToken}
      
      # Configuración de Logs
      LOGGING_LEVEL_CO_COM_PRAGMA: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC: DEBUG
      
      # Health Check
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
      
    ports:
      - "8080:8080"
    volumes:
      - auth_logs:/app/logs
    networks:
      - crediya-network
    depends_on:
      mysql-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================================
  # MICROSERVICIO - Solicitudes de Préstamos
  # ========================================
  load-request-service:
    build:
      context: ./LoadRequestService
      dockerfile: Dockerfile
    container_name: crediya-load-request-service
    restart: unless-stopped
    environment:
      # Configuración del Servidor
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      
      # Configuración de Servicios Externos
      AUTH_SERVICE_URL: http://auth-service:8080
      AUTH_SERVICE_VALIDATE_TOKEN_ENDPOINT: /api/v1/auth/validate-token
      
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080,http://localhost:8081
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-https://sqs.us-east-2.amazonaws.com/882309621524/sqs_notificaciones}
      AWS_SQS_DEBT_CAPACITY_QUEUE_URL: ${AWS_SQS_DEBT_CAPACITY_QUEUE_URL:-https://sqs.us-east-2.amazonaws.com/882309621524/sqs_capacidad}
      AWS_SQS_DEBT_CAPACITY_RESPONSE_QUEUE_URL: ${AWS_SQS_DEBT_CAPACITY_RESPONSE_QUEUE_URL:-https://sqs.us-east-2.amazonaws.com/882309621524/sqs_capacidad_response}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-AKIA423OAM4KPOY7SSPC}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-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}
      
      # Token para comunicación entre servicios
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-CrediYaInternalService2025SecureToken}
      
      LOGGING_LEVEL_CO_COM_PRAGMA: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC: DEBUG
      
      # Health Check
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
      
    ports:
      - "8081:8081"
    volumes:
      - solicitudes_logs:/app/logs
    networks:
      - crediya-network
    depends_on:
      mysql-loans:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# ========================================
# VOLÚMENES PERSISTENTES
# ========================================
volumes:
  # Datos de las bases de datos separadas (persistentes)
  mysql_auth_data:
    driver: local
    name: crediya_mysql_auth_data
  
  mysql_loans_data:
    driver: local
    name: crediya_mysql_loans_data
  
  # Logs de las aplicaciones
  auth_logs:
    driver: local
    name: crediya_auth_logs
    
  solicitudes_logs:
    driver: local
    name: crediya_solicitudes_logs

# ========================================
# REDES
# ========================================
networks:
  crediya-network:
    driver: bridge
    name: crediya-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
