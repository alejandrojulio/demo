# Configuración específica para entorno Docker
# AuthService - Microservicio de Autenticación

spring:
  application:
    name: "AuthService"
  
  # Configuración R2DBC para contenedor
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:mysql://mysql-crediya:3306/crediya_db}
    username: ${SPRING_R2DBC_USERNAME:crediya_user}
    password: ${SPRING_R2DBC_PASSWORD:crediya_pass}
    pool:
      enabled: ${SPRING_R2DBC_POOL_ENABLED:true}
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:20}
      max-idle-time: ${SPRING_R2DBC_POOL_MAX_IDLE_TIME:30m}
      validation-query: SELECT 1

# Configuración del servidor
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Configuración JWT
jwt:
  secret: ${JWT_SECRET:CrediYa2025SecretKeyForJWTTokensVerySecureAndLong123456789}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: "CrediYa-AuthService"

# Configuración de Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Configuración de Logging
logging:
  level:
    co.com.pragma: ${LOGGING_LEVEL_CO_COM_PRAGMA:INFO}
    org.springframework.r2dbc: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_R2DBC:WARN}
    io.r2dbc.mysql: WARN
    reactor.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n"
  file:
    name: /app/logs/auth-service.log
