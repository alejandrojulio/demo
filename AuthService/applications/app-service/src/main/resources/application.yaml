# ===========================================
# CONFIGURACIÓN POR DEFECTO (LOCAL)
# ===========================================
server:
  port: 8080
spring:
  application:
    name: "AuthService"
  devtools:
    add-properties: false
  profiles:
    active: local
  # Configuración R2DBC para desarrollo LOCAL
  r2dbc:
    url: r2dbc:mysql://localhost:3306/auth_db
    username: root
    password: 1234
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m


---
# ===========================================
# CONFIGURACIÓN PARA DOCKER
# ===========================================
spring:
  config:
    activate:
      on-profile: docker
  # Configuración R2DBC para contenedores Docker
  r2dbc:
    url: r2dbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 1234
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

# Configuración JWT
jwt:
  secret: "myDefaultSecretKeyForCrediYaApplicationThatIsLongEnoughToMeetSecurityRequirements"
  expiration: 24

# Configuración de logging para debugging
logging:
  level:
    co.com.pragma.usecase.auth: DEBUG
    co.com.pragma.jwt: DEBUG
    co.com.pragma.api.config: DEBUG
    org.springframework.security: DEBUG

