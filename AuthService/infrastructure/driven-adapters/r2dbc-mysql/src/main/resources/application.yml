server:
  port: 8080
spring:
  application:
    name: "AuthService"
  devtools:
    add-properties: false
  profiles:
    include: null

  # ✅ CONFIGURACIÓN R2DBC para AuthService - Base de datos auth_db
  r2dbc:
    url: r2dbc:mysql://localhost:3306/auth_db
    username: root
    password: "1234"
    pool:
      # ✅ POOLING automático de Spring Boot
      enabled: true
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

app:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:CrediYaInternalService2025SecureToken}
adapters:
  r2dbc:
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:auth_db}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}