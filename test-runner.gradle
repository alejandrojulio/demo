// ========================================
// CONFIGURACIÓN CENTRAL PARA TESTING
// ========================================

// Script Gradle para ejecutar tests en ambos microservicios
// Uso: ./gradlew -b test-runner.gradle testAll

plugins {
    id 'base'
}

// Configuración para ambos microservicios
def microservices = ['AuthService', 'LoadRequestService']

// Task para ejecutar tests unitarios en ambos servicios
task testUnit {
    group = 'verification'
    description = 'Ejecuta tests unitarios en ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🧪 Ejecutando tests unitarios en ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            def result = exec {
                workingDir service
                commandLine gradlewCommand, 'test', '--continue', '--no-daemon'
                ignoreExitValue = true
            }
            
            if (result.exitValue != 0) {
                println "❌ Tests unitarios fallaron en ${service}"
            } else {
                println "✅ Tests unitarios exitosos en ${service}"
            }
        }
    }
}

// Task para ejecutar tests de integración
task testIntegration {
    group = 'verification'
    description = 'Ejecuta tests de integración en ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🔗 Ejecutando tests de integración en ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            def result = exec {
                workingDir service
                commandLine gradlewCommand, 'test', '--tests', '*IntegrationTest', '--continue', '--no-daemon'
                ignoreExitValue = true
            }
            
            if (result.exitValue != 0) {
                println "❌ Tests de integración fallaron en ${service}"
            } else {
                println "✅ Tests de integración exitosos en ${service}"
            }
        }
    }
}

// Task para ejecutar todos los tests
task testAll {
    group = 'verification'
    description = 'Ejecuta todos los tests en ambos microservicios'
    dependsOn testUnit, testIntegration
    
    doLast {
        println "\n📊 RESUMEN DE TESTING:"
        println "🔍 Tests unitarios ejecutados"
        println "🔗 Tests de integración ejecutados"
        println "📈 Reportes de cobertura disponibles en build/reports/jacoco/"
    }
}

// Task para generar reportes de cobertura
task coverageReport {
    group = 'verification'
    description = 'Genera reportes de cobertura para ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n📈 Generando reporte de cobertura para ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            exec {
                workingDir service
                commandLine gradlewCommand, 'jacocoTestReport', '--no-daemon'
                ignoreExitValue = true
            }
            
            println "📊 Reporte disponible en: ${service}/build/reports/jacoco/test/html/index.html"
        }
    }
}

// Task para ejecutar tests de arquitectura
task testArchitecture {
    group = 'verification'
    description = 'Ejecuta tests de arquitectura en ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🏗️ Ejecutando tests de arquitectura en ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            def result = exec {
                workingDir service
                commandLine gradlewCommand, 'test', '--tests', '*ArchitectureTest', '--continue', '--no-daemon'
                ignoreExitValue = true
            }
            
            if (result.exitValue != 0) {
                println "❌ Tests de arquitectura fallaron en ${service}"
            } else {
                println "✅ Tests de arquitectura exitosos en ${service}"
            }
        }
    }
}

// Task para ejecutar tests de mutación (si está configurado)
task testMutation {
    group = 'verification'
    description = 'Ejecuta tests de mutación en ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🔬 Ejecutando tests de mutación en ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            def result = exec {
                workingDir service
                commandLine gradlewCommand, 'pitest', '--continue', '--no-daemon'
                ignoreExitValue = true
            }
            
            if (result.exitValue != 0) {
                println "⚠️ Tests de mutación completados con advertencias en ${service}"
            } else {
                println "✅ Tests de mutación exitosos en ${service}"
            }
            
            println "🔬 Reporte disponible en: ${service}/build/reports/pitest/"
        }
    }
}

// Task para limpiar todos los builds
task cleanAll {
    group = 'build'
    description = 'Limpia todos los builds de ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🧹 Limpiando ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            exec {
                workingDir service
                commandLine gradlewCommand, 'clean', '--no-daemon'
            }
        }
        println "✅ Limpieza completada"
    }
}

// Task para compilar todos los servicios
task buildAll {
    group = 'build'
    description = 'Compila ambos microservicios'
    
    doLast {
        microservices.each { service ->
            println "\n🔨 Compilando ${service}..."
            
            def gradlewCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 
                'gradlew.bat' : './gradlew'
            
            def result = exec {
                workingDir service
                commandLine gradlewCommand, 'build', '-x', 'test', '--no-daemon'
                ignoreExitValue = true
            }
            
            if (result.exitValue != 0) {
                println "❌ Compilación falló en ${service}"
                throw new GradleException("Compilación falló en ${service}")
            } else {
                println "✅ Compilación exitosa en ${service}"
            }
        }
    }
}

// Task para verificar calidad de código
task qualityCheck {
    group = 'verification'
    description = 'Ejecuta verificaciones de calidad de código'
    dependsOn testAll, testArchitecture, coverageReport
    
    doLast {
        println "\n✅ VERIFICACIONES DE CALIDAD COMPLETADAS:"
        println "🧪 Tests unitarios: EJECUTADOS"
        println "🔗 Tests de integración: EJECUTADOS"
        println "🏗️ Tests de arquitectura: EJECUTADOS"
        println "📈 Reportes de cobertura: GENERADOS"
        
        println "\n📋 REPORTES DISPONIBLES:"
        microservices.each { service ->
            println "  ${service}:"
            println "    📊 Cobertura: ${service}/build/reports/jacoco/test/html/index.html"
            println "    🧪 Tests: ${service}/build/reports/tests/test/index.html"
            println "    🏗️ Arquitectura: ${service}/build/issues.json"
        }
    }
}

// Task de ayuda
task helpTesting {
    group = 'help'
    description = 'Muestra ayuda sobre los tasks disponibles'
    
    doLast {
        println """
📚 TASKS DISPONIBLES PARA TESTING:

🧪 TESTING:
  ./gradlew -b test-runner.gradle testUnit         - Tests unitarios
  ./gradlew -b test-runner.gradle testIntegration - Tests de integración  
  ./gradlew -b test-runner.gradle testAll         - Todos los tests
  ./gradlew -b test-runner.gradle testArchitecture- Tests de arquitectura
  ./gradlew -b test-runner.gradle testMutation    - Tests de mutación

📈 REPORTES:
  ./gradlew -b test-runner.gradle coverageReport  - Reportes de cobertura

🔨 BUILD:
  ./gradlew -b test-runner.gradle cleanAll        - Limpiar todo
  ./gradlew -b test-runner.gradle buildAll        - Compilar todo
  ./gradlew -b test-runner.gradle qualityCheck    - Verificación completa

💡 EJEMPLOS:
  # Ejecutar solo tests unitarios
  ./gradlew -b test-runner.gradle testUnit
  
  # Verificación completa de calidad
  ./gradlew -b test-runner.gradle qualityCheck
  
  # Limpiar y ejecutar todos los tests
  ./gradlew -b test-runner.gradle cleanAll testAll

📁 Los reportes se generan en:
  - AuthService/build/reports/
  - LoadRequestService/build/reports/
"""
    }
}

// Task por defecto
defaultTasks 'helpTesting'
